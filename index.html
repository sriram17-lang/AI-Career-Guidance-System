<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Career Guidance</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2ff;
    text-align: center;
    padding: 25px 15px;
}
.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    max-width: 400px;
    margin: 30px auto;
    box-shadow: 0 4px 15px #ccd0e0;
}
h1 { color: #4338ca; }
input, select, button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
    border-radius: 8px;
    font-size: 16px;
}
input, select { border: 1px solid #aaa; }
button {
    background: #4338ca;
    color: white;
    border: none;
    cursor: pointer;
}
#result {
    margin-top: 20px;
    color: #166534;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="card">
    <h1>🎯 Career Guide</h1>
    <p>Discover a career that matches your interests!</p>

    <input id="name" placeholder="Enter your name">

    <select id="interest">
        <option value="">Choose your interest</option>
        <option value="programming">Programming</option>
        <option value="networking">Networking</option>
        <option value="design">Design</option>
        <option value="data">Data Analysis</option>
        <option value="security">Cybersecurity</option>
    </select>

    <button onclick="suggestCareer()">Find My Career 🚀</button>

    <div id="result"></div>
</div>

<script>
function suggestCareer() {
    const name = document.getElementById("name").value.trim();
    const interest = document.getElementById("interest").value;
    const result = document.getElementById("result");

    if (!name || !interest) {
        result.textContent = "Please enter your name and choose an interest.";
        return;
    }

    const careers = {
        programming: "Software Developer 💻",
        networking: "Network Engineer 🌐",
        design: "UI/UX Designer 🎨",
        data: "Data Analyst 📊",
        security: "Cybersecurity Analyst 🔐"
    };

    result.textContent = "Hello " + name +
        "! Your suggested career is: " + careers[interest];
}
</script>

</body>
</html>
