
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Career Guidance System</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2ff;
  padding: 20px;
  text-align: center;
}
.card {
  background: white;
  max-width: 430px;
  margin: 20px auto;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 4px 16px #ccd0e0;
}
h1 { color: #4338ca; }
input, select, button {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  box-sizing: border-box;
  border-radius: 9px;
  font-size: 16px;
}
input, select { border: 1px solid #aaa; }
button {
  background: #4338ca;
  color: white;
  border: none;
  font-weight: bold;
}
#result {
  text-align: left;
  margin-top: 20px;
  line-height: 1.7;
}
.career { color: #166534; font-size: 20px; }
</style>
</head>
<body>

<div class="card">
  <h1>🎯 Career Guide</h1>
  <p>Discover your career and learning roadmap!</p>

  <input id="name" placeholder="Enter your name">

  <select id="interest">
    <option value="">Choose your interest</option>
    <option value="programming">Programming</option>
    <option value="networking">Networking</option>
    <option value="design">Design</option>
    <option value="data">Data Analysis</option>
    <option value="security">Cybersecurity</option>
  </select>

  <button type="button" onclick="suggestCareer()">
    Find My Career 🚀
  </button>

  <div id="result" aria-live="polite"></div>
</div>

<script>
const careers = {
  programming: {
    title: "Software Developer 💻",
    skills: [
      "Learn HTML, CSS and JavaScript",
      "Learn Python or Java",
      "Practice Data Structures",
      "Build 2 small projects",
      "Upload your projects to GitHub"
    ]
  },
  networking: {
    title: "Network Engineer 🌐",
    skills: [
      "Learn networking basics",
      "Understand TCP/IP and DNS",
      "Practice subnetting",
      "Learn network troubleshooting",
      "Build a small network lab"
    ]
  },
  design: {
    title: "UI/UX Designer 🎨",
    skills: [
      "Learn design principles",
      "Study colour and typography",
      "Practice wireframing",
      "Learn Figma basics",
      "Create a design portfolio"
    ]
  },
  data: {
    title: "Data Analyst 📊",
    skills: [
      "Learn Excel basics",
      "Learn SQL",
      "Learn Python basics",
      "Practice charts and data analysis",
      "Build a data analysis project"
    ]
  },
  security: {
    title: "Cybersecurity Analyst 🔐",
    skills: [
      "Learn computer networking",
      "Understand operating systems",
      "Study security fundamentals",
      "Practice in legal training labs",
      "Create a security learning project"
    ]
  }
};

function suggestCareer() {
  const name = document.getElementById("name").value.trim();
  const interest = document.getElementById("interest").value;
  const result = document.getElementById("result");

  if (!name || !interest) {
    result.textContent =
      "Please enter your name and choose an interest.";
    return;
  }

  const career = careers[interest];

  result.innerHTML = "";

  const greeting = document.createElement("p");
  greeting.textContent = "Hello " + name + "!";
  result.appendChild(greeting);

  const heading = document.createElement("h2");
  heading.className = "career";
  heading.textContent = career.title;
  result.appendChild(heading);

  const roadmapTitle = document.createElement("h3");
  roadmapTitle.textContent = "🛣️ Your Learning Roadmap";
  result.appendChild(roadmapTitle);

  const list = document.createElement("ol");

  career.skills.forEach(function(skill) {
    const item = document.createElement("li");
    item.textContent = skill;
    list.appendChild(item);
  });

  result.appendChild(list);
}
</script>

</body>
</html>
